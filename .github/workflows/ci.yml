name: CI

# Runs on pull requests, and is the gate docker-publish.yml calls before it publishes
# anything, so the checks guarding a PR and the checks guarding a deploy can't drift apart.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile.
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # The built page served by the real production server. The catalogue isn't loaded here
      # (POKEPROXY_REFRESH=off: CI doesn't depend on TCGSL), so the API answers "not yet".
      - name: Smoke test the production server
        run: |
          PORT=7199 POKEPROXY_REFRESH=off node server/server.mjs &
          server=$!
          for _ in $(seq 1 20); do curl -sf http://127.0.0.1:7199/healthz && break; sleep 0.5; done
          curl -sf http://127.0.0.1:7199/ | grep -q '<title>PokeProxy</title>'
          curl -sf http://127.0.0.1:7199/anything | grep -q '<title>PokeProxy</title>'
          curl -sI http://127.0.0.1:7199/ | grep -qi "content-security-policy: default-src 'self'"
          curl -sI http://127.0.0.1:7199/ | grep -qi "img-src 'self' data: blob: https://tcgsl.ewolution.cloud"
          curl -sI http://127.0.0.1:7199/ | grep -qi "cache-control: no-cache"
          curl -sf http://127.0.0.1:7199/manifest.webmanifest | grep -q '"name": "PokeProxy"'
          curl -sf -o /dev/null http://127.0.0.1:7199/sw.js
          asset=$(curl -s http://127.0.0.1:7199/ | grep -o '/assets/[^"]*\.js' | head -1)
          curl -sI "http://127.0.0.1:7199$asset" | grep -qi 'cache-control: public, max-age=31536000, immutable'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7199/assets/missing.js)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:7199/)" = 405
          # The API: the catalogue isn't in, so search and links say so; nothing else under /api.
          curl -sf http://127.0.0.1:7199/api/status | grep -q '"ready":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:7199/api/search?q=charizard')" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{"url":"https://example.com/"}' http://127.0.0.1:7199/api/link)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7199/api/nope)" = 404
          # The Census forwarder is wired in; without POKEPROXY_CENSUS it answers locally.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:7199/_e.js)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' http://127.0.0.1:7199/_e)" = 204
          kill $server
          wait $server || true
